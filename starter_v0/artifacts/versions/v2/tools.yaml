# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng để bổ sung thông tin bắt buộc hoặc xác nhận một hành động. Dùng khi thiếu tài khoản, URL, hoặc trước khi gửi; không dùng để tìm dữ liệu."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, cụ thể cần người dùng trả lời"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Dùng yes_no để xin xác nhận trước hành động gửi"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây của một tài khoản cụ thể. Chỉ dùng khi biết tài khoản; không dùng để tìm theo chủ đề hoặc khi thiếu tên tài khoản."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản, không có ký tự @; ví dụ Sam Altman là sama, Elon Musk là elonmusk"}
        limit: {type: integer, default: 5, description: "Số bài đăng cần lấy; giữ đúng số người dùng yêu cầu"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên X/Twitter theo chủ đề hoặc từ khóa. Không dùng để lấy bài của một tài khoản cụ thể; khi đó dùng timeline."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề hoặc từ khóa chính của người dùng, không thêm nội dung không được yêu cầu"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest cho mới nhất; Top cho phổ biến hoặc top"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm thông tin trên web. Dùng topic=news cho tin tức và topic=general cho tìm kiếm thông thường. Không dùng nếu người dùng đã cung cấp URL cụ thể; khi đó dùng fetch."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ giữ chủ đề chính, ví dụ AI hoặc robotics; không thêm các từ như news, today nếu không thuộc chủ đề"}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức; general cho thông tin web thông thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "today/hôm nay=day; tuần này=this week=week; tháng này=month; năm này=year"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một URL cụ thể do người dùng cung cấp. Không tự đoán hoặc tạo URL; nếu thiếu URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ do người dùng cung cấp"}
      required: [url]

  - name: format
    description: "Trình bày các item đã được tool khác lấy về thành digest. Không dùng để tìm dữ liệu mới và không gọi nếu chỉ cần trả lời một item đơn giản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Kiểu trình bày digest"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung lên kênh đã cấu hình. Đây là hành động có side effect: chỉ dùng sau khi người dùng đã xác nhận rõ ràng qua clarify với response_type=yes_no; không tự đặt confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau khi người dùng trả lời xác nhận rõ ràng; nếu chưa xác nhận phải dùng clarify"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu policy nội bộ khi người dùng hỏi về quy định công ty; không dùng cho tìm kiếm web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv khi người dùng yêu cầu paper hoặc nghiên cứu; không dùng cho tin tức web thông thường."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Đọc text từ một paper arXiv cụ thể khi đã có ID hoặc URL; không dùng để tìm paper theo từ khóa."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
